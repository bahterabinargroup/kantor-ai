<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kantor AI</title>
<style>
  :root{
    --bg:#0b1020; --panel:#121933; --line:#222c52; --text:#e8ecff; --muted:#8b95c9;
    --working:#22c55e; --idle:#38bdf8; --blocked:#ef4444; --sleeping:#64748b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .legend b{color:var(--text)}
  .conn{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--sleeping)}
  .dot.on{background:var(--working);box-shadow:0 0 8px var(--working)}
  main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 330px;gap:14px;padding:14px 20px 18px}
  @media(max-width:900px){main{grid-template-columns:1fr;grid-auto-rows:minmax(420px,auto)}}
  .stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#070b18;min-height:420px}
  #scene{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #scene.drag{cursor:grabbing}
  .tools{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:3}
  .tool{padding:6px 12px;border-radius:10px;border:1px solid #2b3766;background:#0d1431cc;color:var(--text);font:600 12px system-ui;cursor:pointer;backdrop-filter:blur(4px)}
  .tool.on{background:#1d4ed8;border-color:#3b82f6}
  .hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12px;color:#9aa6dd;opacity:.85;pointer-events:none;text-shadow:0 1px 3px #000}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lbl{position:absolute;transform:translate(-50%,-100%);padding:2px 8px;border-radius:999px;font:600 11px system-ui;color:#fff;background:#0b1020d9;border:1px solid var(--c,#64748b);white-space:nowrap}
  .lbl small{font-weight:500;opacity:.8;margin-left:4px}
  .card{position:absolute;left:12px;bottom:34px;width:290px;max-height:calc(100% - 60px);overflow:auto;background:#0d1431ee;border:1px solid #2b3766;border-radius:14px;padding:14px;z-index:4;backdrop-filter:blur(6px)}
  .card[hidden]{display:none}
  .card .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  .card .nm{font-weight:650;font-size:16px}
  .card .rl{color:var(--muted);font-size:13px;margin-top:2px}
  .badge{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;color:#06101f;background:var(--c,var(--sleeping))}
  .card .dt{margin-top:8px;font-size:13px;word-break:break-word;min-height:18px}
  .card .sn{margin-top:6px;font-size:12px;color:var(--muted)}
  .toggle{margin-top:12px;width:100%;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:#0e1530;color:var(--text);font:600 13px system-ui;cursor:pointer}
  .toggle.off{background:#3a1620;border-color:#7a2a2a;color:#fecaca}
  .toggle.on{background:#10321f;border-color:#1f6b3c;color:#bbf7d0}
  .toggle:disabled{opacity:.5;cursor:wait}
  .edit{margin-top:8px;width:100%;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:#0e1530;color:var(--text);font:600 12px system-ui;cursor:pointer}
  .form label{display:block;margin-top:10px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .form input[type=text]{width:100%;margin-top:4px;padding:7px 9px;border-radius:8px;border:1px solid #2b3766;background:#0a1126;color:var(--text);font:14px system-ui}
  .emojis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .emojis button{width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:#0a1126;font-size:18px;cursor:pointer}
  .emojis button.sel,.sw.sel{border-color:#60a5fa;box-shadow:0 0 0 1px #60a5fa}
  .swatches{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .row2{display:flex;gap:8px;margin-top:12px}
  .row2 button{flex:1;padding:7px;border-radius:9px;border:1px solid var(--line);background:#0e1530;color:var(--text);font:600 13px system-ui;cursor:pointer}
  .row2 .ok{background:#1d4ed8;border-color:#3b82f6}
  aside{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;overflow:auto;min-height:0}
  aside h2{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
  .agent{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
  .agent:first-of-type{border-top:0}
  .agent .em{font-size:22px}
  .agent .nf{flex:1;min-width:0}
  .agent .nf b{display:block;font-weight:650}
  .agent .nf span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .agent .st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#06101f;background:var(--c,var(--sleeping))}
  .agent.disabled{opacity:.55}
  .sep{height:14px}
  .ev{padding:7px 0;border-top:1px solid var(--line);font-size:13px}
  .ev:first-of-type{border-top:0}
  .ev .t{color:var(--muted);font-size:11px}
  .ev.error .m{color:#fca5a5}
  .ev.warn .m{color:#fcd34d}
  .empty,.err{color:var(--muted);padding:20px;text-align:center}
  .err{color:#fca5a5}
</style>
</head>
<body>
<header>
  <span style="font-size:22px">🏢</span>
  <h1>Kantor AI</h1>
  <div class="legend" id="legend"></div>
  <a href="/laporan.html" style="color:var(--muted);text-decoration:none;font-size:13px;margin-left:8px">📒 Laporan keuangan</a>
  <a href="/vps.html" style="color:var(--muted);text-decoration:none;font-size:13px;margin-left:8px">🖥️ Kondisi VPS</a>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText">menghubungkan…</span></div>
</header>
<main>
  <section class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div class="tools">
      <button class="tool on" id="tNight">🌙 Malam</button>
      <button class="tool" id="tFlow">⇢ Alur</button>
      <button class="tool on" id="tLabel">🏷 Label</button>
    </div>
    <div class="card" id="card" hidden></div>
    <div class="hint">Geser untuk memutar · scroll / cubit untuk zoom · Shift + geser untuk menggeser · klik karakter untuk detail</div>
  </section>
  <aside>
    <h2>Agen</h2>
    <div id="agents"></div>
    <div class="sep"></div>
    <h2>Aktivitas terbaru</h2>
    <div id="events"></div>
  </aside>
</main>

<script src="config.js"></script>
<script src="three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
  const LABEL = { working: 'Kerja', idle: 'Santai', blocked: 'Macet', sleeping: 'Tidur' };
  const COLOR = { working: '#22c55e', idle: '#38bdf8', blocked: '#ef4444', sleeping: '#64748b' };
  const cfg = window.KANTOR_CONFIG || {};
  const $ = id => document.getElementById(id);
  const dot = $('dot'), connText = $('connText');
  const agents = new Map();
  let events = [];
  let selectedId = null;
  let editing = false;
  const EMOJIS = ['🤖','💧','📣','📒','🎬','🕷','🧑‍💻','👩‍💼','👨‍🍳','🧾','📊','📦','🛒','🧠','⚙️','🔧','📞','✍️','🎯','🚀','🔍','🏭','🍜','☕'];
  const COLORS = ['#6366f1','#0ea5e9','#22c55e','#f59e0b','#ef4444','#ec4899','#a855f7','#14b8a6'];

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function ago(iso) {
    const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
    if (s < 60) return 'baru saja';
    if (s < 3600) return Math.floor(s / 60) + ' mnt lalu';
    if (s < 86400) return Math.floor(s / 3600) + ' jam lalu';
    return Math.floor(s / 86400) + ' hari lalu';
  }
  const sorted = () => [...agents.values()].sort((a, b) => a.name.localeCompare(b.name));
  const effStatus = a => a.enabled ? a.status : 'sleeping';

  // ───────────────────────── panel samping ─────────────────────────
  function renderLegend() {
    const c = { working: 0, idle: 0, blocked: 0, sleeping: 0 };
    sorted().forEach(a => { c[effStatus(a)] = (c[effStatus(a)] || 0) + 1; });
    const box = $('legend'); box.replaceChildren();
    for (const k of ['working', 'idle', 'blocked', 'sleeping']) {
      const s = el('span'); const i = el('i'); i.style.background = COLOR[k];
      s.append(i, document.createTextNode(LABEL[k] + ' '), el('b', null, String(c[k])));
      box.append(s);
    }
  }
  function renderAgentList() {
    const box = $('agents'); box.replaceChildren();
    const list = sorted();
    if (!list.length) { box.append(el('div', 'empty', 'Belum ada agen terdaftar.')); return; }
    for (const a of list) {
      const st = effStatus(a);
      const row = el('div', 'agent' + (a.enabled ? '' : ' disabled'));
      row.style.setProperty('--c', COLOR[st]);
      row.append(el('div', 'em', a.emoji || '🤖'));
      const nf = el('div', 'nf'); nf.append(el('b', null, a.name), el('span', null, a.enabled ? (a.status_detail || a.role || '') : 'nonaktif'));
      row.append(nf, el('div', 'st', LABEL[st]));
      row.onclick = () => select(a.id);
      box.append(row);
    }
  }
  function renderEvents() {
    const box = $('events'); box.replaceChildren();
    if (!events.length) { box.append(el('div', 'empty', 'Belum ada aktivitas.')); return; }
    for (const e of events) {
      const row = el('div', 'ev ' + (e.level || 'info'));
      const who = (agents.get(e.agent_id) || {}).name || e.agent_id || 'sistem';
      row.append(el('div', 't', who + ' · ' + ago(e.created_at)));
      row.append(el('div', 'm', (e.event || '') + (e.message ? ' — ' + e.message : '')));
      box.append(row);
    }
  }
  function renderCard(force) {
    const card = $('card');
    const a = agents.get(selectedId);
    if (!a) { card.hidden = true; editing = false; return; }
    if (editing && !force && !card.hidden) return;   // jangan hapus ketikan saat data realtime masuk
    const st = effStatus(a);
    card.hidden = false; card.replaceChildren();
    const x = el('button', 'x', '×'); x.onclick = () => select(null);
    card.append(x, el('div', 'nm', (a.emoji || '🤖') + ' ' + a.name), el('div', 'rl', a.role || ''));
    const b = el('span', 'badge', LABEL[st]); b.style.setProperty('--c', COLOR[st]);
    card.append(b, el('div', 'dt', a.enabled ? (a.status_detail || '') : 'Agen dimatikan'), el('div', 'sn', 'aktif ' + ago(a.last_active_at)));
    const btn = el('button', 'toggle ' + (a.enabled ? 'off' : 'on'), a.enabled ? '⏻ Matikan agen' : '⏻ Nyalakan agen');
    btn.onclick = () => toggleAgent(a, btn);
    const ed = el('button', 'edit', '✏️ Ubah nama & logo');
    ed.onclick = () => { editing = true; renderCard(true); };
    card.append(btn, ed);
    if (editing) renderForm(a, card);
  }
  function renderForm(a, card) {
    card.replaceChildren();
    const x = el('button', 'x', '×'); x.onclick = () => { editing = false; select(null); };
    const f = el('div', 'form');
    let emoji = a.emoji || '🤖', color = a.color || COLORS[0];
    const nameIn = el('input'); nameIn.type = 'text'; nameIn.maxLength = 30; nameIn.value = a.name;
    const emIn = el('input'); emIn.type = 'text'; emIn.maxLength = 8; emIn.value = emoji;
    const eb = el('div', 'emojis');
    const markE = () => [...eb.children].forEach(b => b.classList.toggle('sel', b.textContent === emoji));
    EMOJIS.forEach(e => { const b = el('button', null, e); b.type = 'button'; b.onclick = () => { emoji = e; emIn.value = e; markE(); }; eb.append(b); });
    emIn.oninput = () => { emoji = emIn.value.trim(); markE(); };
    const sw = el('div', 'swatches');
    const markC = () => [...sw.children].forEach(b => b.classList.toggle('sel', b.dataset.c === color));
    COLORS.forEach(c => { const b = el('button', 'sw'); b.type = 'button'; b.dataset.c = c; b.style.background = c; b.onclick = () => { color = c; markC(); }; sw.append(b); });
    const l1 = el('label', null, 'Nama'), l2 = el('label', null, 'Logo (emoji)'), l3 = el('label', null, 'Warna baju');
    const row = el('div', 'row2');
    const cancel = el('button', null, 'Batal'); cancel.onclick = () => { editing = false; renderCard(); };
    const save = el('button', 'ok', 'Simpan');
    save.onclick = async () => {
      const name = nameIn.value.trim();
      if (!name) { alert('Nama tidak boleh kosong'); return; }
      save.disabled = true; save.textContent = 'menyimpan…';
      try {
        const r = await fetch('/api/agent-profile', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ agent_id: a.id, name, emoji: emoji || null, color }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.ok) throw new Error(j.message || ('HTTP ' + r.status));
        a.name = name; if (emoji) a.emoji = emoji; a.color = color;
        editing = false; refresh();
      } catch (e) { alert('Gagal menyimpan: ' + e.message); save.disabled = false; save.textContent = 'Simpan'; }
    };
    row.append(cancel, save);
    f.append(el('div', 'nm', 'Ubah ' + a.name), l1, nameIn, l2, emIn, eb, l3, sw, row);
    card.append(x, f); markE(); markC();
  }
  function select(id) { if (id !== selectedId) editing = false; selectedId = id; renderCard(); }

  async function toggleAgent(a, btn) {
    const to = !a.enabled;
    if (!to && !confirm('Matikan agen ' + a.name + '? Pesan WhatsApp tidak akan diproses sampai dinyalakan lagi.')) return;
    btn.disabled = true; btn.textContent = 'memproses…';
    try {
      const r = await fetch('/api/agent-toggle', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ agent_id: a.id, enabled: to }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.message || ('HTTP ' + r.status));
      a.enabled = to; a.status = to ? 'idle' : 'sleeping'; a.status_detail = to ? 'Diaktifkan' : 'Dimatikan';
      refresh();
    } catch (e) { alert('Gagal mengubah agen: ' + e.message); refresh(); }
  }

  // ───────────────────────── kantor 3D ─────────────────────────
  const T = window.THREE;
  let office = null;
  const SKIN = [0xf2c9a0, 0xd9a577, 0xb97c52, 0x8d5a3b, 0xf5d5b8];
  const HAIR = [0x2b1d14, 0x4a2c17, 0x111111, 0x6b4423, 0x8a8a8a];

  function tex(draw, w = 256, h = 256) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new T.CanvasTexture(c); t.anisotropy = 4; return t;
  }
  const mat = (color, o = {}) => new T.MeshStandardMaterial(Object.assign({ color, roughness: .85, metalness: .05 }, o));
  function box(w, h, d, m, x = 0, y = 0, z = 0, parent) {
    const me = new T.Mesh(new T.BoxGeometry(w, h, d), m);
    me.position.set(x, y, z); me.castShadow = true; me.receiveShadow = true;
    if (parent) parent.add(me); return me;
  }

  function sprite(text, color, size = 1) {
    const t = tex((g, w, h) => {
      g.clearRect(0, 0, w, h); g.font = 'bold 150px system-ui'; g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.shadowColor = '#000'; g.shadowBlur = 12; g.fillText(text, w / 2, h / 2);
    }, 256, 256);
    const s = new T.Sprite(new T.SpriteMaterial({ map: t, transparent: true, depthWrite: false }));
    s.scale.set(size, size, 1); return s;
  }

  function initOffice() {
    if (!T) return null;
    const canvas = $('scene'), stage = $('stage');
    let renderer;
    try { renderer = new T.WebGLRenderer({ canvas, antialias: true }); } catch (e) { return null; }
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
    const scene = new T.Scene();
    const camera = new T.OrthographicCamera(-10, 10, 10, -10, -100, 200);
    const world = new T.Group(); scene.add(world);

    const state = { night: true, flow: false, labels: true, az: 0.78, el: 0.62, zoom: 1, pan: new T.Vector3(), time: 0, entities: new Map(), room: { W: 16, D: 12 } };
    const lights = {};
    lights.amb = new T.AmbientLight(0x8fa0ff, .5); scene.add(lights.amb);
    lights.sun = new T.DirectionalLight(0xffffff, .8); lights.sun.position.set(8, 14, 10); lights.sun.castShadow = true;
    lights.sun.shadow.mapSize.set(2048, 2048); const sc = lights.sun.shadow.camera; sc.left = -16; sc.right = 16; sc.top = 16; sc.bottom = -16; sc.far = 60;
    scene.add(lights.sun);
    lights.warm = []; // titik cahaya hangat di atas meja (malam)

    const rackLeds = [];
    let rackPos = new T.Vector3();
    const flowDots = [];
    let flowLines = [];

    function clearWorld() {
      while (world.children.length) {
        const c = world.children.pop();
        c.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) { (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); } });
      }
      lights.warm.forEach(l => scene.remove(l)); lights.warm = [];
      rackLeds.length = 0; flowDots.length = 0; flowLines = []; state.entities.clear();
    }

    function build(list) {
      clearWorld();
      const n = Math.max(list.length, 1);
      const cols = Math.min(4, Math.max(2, Math.ceil(Math.sqrt(n * 1.6))));
      const rows = Math.ceil(n / cols);
      const W = Math.max(16, cols * 3.7 + 6), D = Math.max(12, rows * 4 + 6);
      state.room = { W, D };

      // lantai kayu
      const floorTex = tex((g, w, h) => {
        g.fillStyle = '#b9a58a'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#c2af95' : '#b09b80'; g.fillRect(0, i * h / 8, w, h / 8 - 2); }
        g.fillStyle = '#00000022'; for (let i = 0; i < 8; i++) g.fillRect(0, i * h / 8 - 1, w, 2);
      }); floorTex.wrapS = floorTex.wrapT = T.RepeatWrapping; floorTex.repeat.set(W / 3, D / 3);
      const floor = box(W, .3, D, mat(0xffffff, { map: floorTex, roughness: .7 }), 0, -.15, 0, world); floor.castShadow = false;

      // dinding (kiri & belakang)
      const wallM = mat(0xe9e7e2, { roughness: .95 });
      box(.3, 5, D, wallM, -W / 2, 2.5, 0, world);
      box(W, 5, .3, wallM, 0, 2.5, -D / 2, world);
      box(.35, .25, D, mat(0xcfcbc3), -W / 2 + .02, .12, 0, world);
      box(W, .25, .35, mat(0xcfcbc3), 0, .12, -D / 2 + .02, world);
      // lis lampu LED hangat di atas dinding
      const strip = new T.MeshStandardMaterial({ color: 0xffe2b0, emissive: 0xffd08a, emissiveIntensity: 2 });
      box(.12, .08, D, strip, -W / 2 + .2, 4.95, 0, world).castShadow = false;
      box(W, .08, .12, strip, 0, 4.95, -D / 2 + .2, world).castShadow = false;
      state.strip = strip;

      // jendela (kota malam / langit siang)
      state.windowMats = [];
      const winTex = (night) => tex((g, w, h) => {
        if (night) { g.fillStyle = '#0a1230'; g.fillRect(0, 0, w, h);
          for (let i = 0; i < 60; i++) { g.fillStyle = Math.random() > .5 ? '#ffd27a' : '#6f84d8'; g.fillRect(Math.random() * w, Math.random() * h, 3, 3 + Math.random() * 6); } }
        else { const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#7cc4ff'); gr.addColorStop(1, '#d9efff'); g.fillStyle = gr; g.fillRect(0, 0, w, h);
          g.fillStyle = '#ffffffaa'; g.beginPath(); g.ellipse(80, 70, 50, 18, 0, 0, 7); g.ellipse(170, 110, 60, 20, 0, 0, 7); g.fill(); }
      });
      state.winNight = winTex(true); state.winDay = winTex(false);
      const addWindow = (x, z, rotY) => {
        const g = new T.Group(); g.position.set(x, 2.8, z); g.rotation.y = rotY;
        const frame = box(2.6, 2.1, .12, mat(0x2b2f3a), 0, 0, 0, g);
        const glass = new T.Mesh(new T.PlaneGeometry(2.3, 1.8), new T.MeshBasicMaterial({ map: state.winNight }));
        glass.position.z = .07; g.add(glass); state.windowMats.push(glass.material);
        world.add(g);
      };
      const nWinBack = Math.max(2, Math.floor((W - 9) / 4.4)), nWinLeft = Math.max(2, Math.floor(D / 5));
      for (let i = 0; i < nWinBack; i++) addWindow(-W / 2 + 4 + i * 4.4, -D / 2 + .2, 0);
      for (let i = 0; i < nWinLeft; i++) addWindow(-W / 2 + .2, -D / 2 + 2.6 + i * ((D - 4) / nWinLeft), Math.PI / 2);

      // logo di dinding belakang
      const logoTex = tex((g, w, h) => {
        g.fillStyle = '#10163a'; g.fillRect(0, 0, w, h); g.strokeStyle = '#4f7cff'; g.lineWidth = 6; g.strokeRect(6, 6, w - 12, h - 12);
        g.fillStyle = '#e8ecff'; g.font = 'bold 64px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('KANTOR AI', w / 2, h / 2 - 12);
        g.fillStyle = '#7f8fe0'; g.font = '26px system-ui'; g.fillText('Tim agen digital', w / 2, h / 2 + 40);
      }, 512, 192);
      const logo = new T.Mesh(new T.PlaneGeometry(4.2, 1.575), new T.MeshBasicMaterial({ map: logoTex }));
      logo.position.set(W / 2 - 3.4, 3.3, -D / 2 + .2); world.add(logo);

      // papan tulis + jam
      const board = new T.Group(); board.position.set(-W / 2 + .2, 2.7, D / 2 - 3); board.rotation.y = Math.PI / 2;
      box(2.4, 1.5, .08, mat(0xf4f4f4), 0, 0, 0, board);
      ['#fde047', '#86efac', '#93c5fd', '#fca5a5'].forEach((c, i) => box(.38, .38, .02, mat(c), -.8 + i * .5, .25 - (i % 2) * .45, .06, board));
      world.add(board);
      const clock = new T.Mesh(new T.CylinderGeometry(.35, .35, .06, 24), mat(0xf6f6f6)); clock.rotation.x = Math.PI / 2; clock.position.set(-W / 2 + .22, 3.6, -D / 2 + 3); clock.rotation.z = Math.PI / 2; world.add(clock);

      // server rack
      const rack = new T.Group(); rack.position.set(W / 2 - 1.4, 0, -D / 2 + 1.2);
      box(1.4, 3.2, 1.2, mat(0x151a2c, { roughness: .5 }), 0, 1.6, 0, rack);
      for (let i = 0; i < 9; i++) for (let j = 0; j < 3; j++) {
        const m = new T.MeshStandardMaterial({ color: 0x113322, emissive: 0x22ff88, emissiveIntensity: 0 });
        const led = box(.14, .08, .02, m, -.45 + j * .45, .5 + i * .3, .61, rack); led.castShadow = false; rackLeds.push(m);
      }
      world.add(rack); rackPos.set(W / 2 - 1.4, 1.8, -D / 2 + 1.2);

      // karpet + bean bag (pojok depan-kiri)
      const lx = -W / 2 + 3, lz = D / 2 - 2.6;
      [[1.9, 0xe8e2d6], [1.5, 0xe0522f], [1.1, 0xf4b83a], [.7, 0x17233e]].forEach(([r, c], i) => {
        const cy = new T.Mesh(new T.CylinderGeometry(r, r, .03 + i * .01, 32), mat(c)); cy.position.set(lx, .02 + i * .01, lz); cy.receiveShadow = true; world.add(cy);
      });
      const bean = new T.Mesh(new T.SphereGeometry(.7, 20, 14), mat(0xf5b323)); bean.scale.set(1, .6, 1); bean.position.set(lx, .45, lz); bean.castShadow = true; world.add(bean);

      // tanaman
      const plant = (x, z, s = 1) => {
        const g = new T.Group(); g.position.set(x, 0, z);
        const pot = new T.Mesh(new T.CylinderGeometry(.3 * s, .22 * s, .45 * s, 12), mat(0x3b3f4d)); pot.position.y = .22 * s; pot.castShadow = true; g.add(pot);
        [[0, 0], [.15, .1], [-.15, .05]].forEach(([dx, dz], i) => { const l = new T.Mesh(new T.SphereGeometry((.45 - i * .08) * s, 10, 8), mat(i % 2 ? 0x2f8f4e : 0x3fae60)); l.position.set(dx * s, (.9 + i * .22) * s, dz * s); l.castShadow = true; g.add(l); });
        world.add(g);
      };
      plant(-W / 2 + .9, -D / 2 + .9); plant(W / 2 - .9, D / 2 - .9, .9); plant(-W / 2 + .9, D / 2 - .9, .8);

      // meja + karakter
      const sx = 3.7, sz = 4;
      const startX = -((cols - 1) * sx) / 2 + 0.6, startZ = -D / 2 + 3.4;
      const codeTex = tex((g, w, h) => {
        g.fillStyle = '#052e16'; g.fillRect(0, 0, w, h);
        for (let i = 0; i < 24; i++) { g.fillStyle = ['#4ade80', '#86efac', '#22c55e'][i % 3]; g.fillRect(14 + (i % 4) * 10, 8 + i * 10, 40 + Math.random() * 150, 5); }
      }); codeTex.wrapS = codeTex.wrapT = T.RepeatWrapping; state.codeTex = codeTex;

      list.forEach((a, idx) => {
        const cx = startX + (idx % cols) * sx, cz = startZ + Math.floor(idx / cols) * sz;
        const g = new T.Group(); g.position.set(cx, 0, cz); world.add(g);
        // meja
        const wood = mat(0xf0ede6, { roughness: .6 });
        box(2.3, .1, 1.15, wood, 0, 1.0, 0, g);
        [[-1.05, -.5], [1.05, -.5], [-1.05, .5], [1.05, .5]].forEach(([x, z]) => box(.08, 1, .08, mat(0x8a8f9c), x, .5, z, g));
        // monitor
        const screenMat = new T.MeshStandardMaterial({ color: 0x0b1020, emissive: 0x000000, emissiveIntensity: 1, roughness: .4 });
        box(.95, .6, .07, mat(0x1b2030), 0, 1.5, -.28, g);
        const scr = new T.Mesh(new T.PlaneGeometry(.84, .5), screenMat); scr.position.set(0, 1.5, -.244); scr.rotation.y = 0; g.add(scr);
        box(.12, .22, .1, mat(0x1b2030), 0, 1.17, -.28, g);
        box(.6, .03, .22, mat(0x2a2f40), 0, 1.07, .12, g);                     // keyboard
        box(.2, .14, .2, mat(0xffffff), .85, 1.12, .1, g);                      // mug
        // kursi
        const chair = new T.Group(); chair.position.set(0, 0, 1.15); g.add(chair);
        box(.7, .1, .65, mat(0x2a2f40), 0, .55, 0, chair); box(.7, .75, .1, mat(0x2a2f40), 0, 1.0, .3, chair);
        const stem = new T.Mesh(new T.CylinderGeometry(.05, .05, .5, 8), mat(0x555a68)); stem.position.y = .27; chair.add(stem);
        box(.8, .06, .08, mat(0x555a68), 0, .04, 0, chair);
        // karakter (duduk menghadap -z)
        const person = new T.Group(); person.position.set(0, .6, 1.12); g.add(person);
        const skin = SKIN[idx % SKIN.length], hair = HAIR[(idx * 2) % HAIR.length];
        const shirt = new T.Color(a.color || '#6366f1');
        const body = new T.Group(); person.add(body);
        const shirtM = mat(shirt, { roughness: .8 }), skinM = mat(skin, { roughness: .7 }), hairM = mat(hair);
        box(.56, .72, .34, shirtM, 0, .42, 0, body);                       // badan
        const head = new T.Group(); head.position.set(0, .98, 0); body.add(head);
        const hd = new T.Mesh(new T.SphereGeometry(.24, 16, 12), skinM); hd.castShadow = true; head.add(hd);
        box(.5, .18, .5, hairM, 0, .13, .02, head);
        const armL = new T.Group(), armR = new T.Group();
        armL.position.set(-.34, .7, 0); armR.position.set(.34, .7, 0); body.add(armL, armR);
        [armL, armR].forEach(ar => { const m = box(.14, .55, .14, shirtM, 0, -.26, 0, ar); m.position.set(0, -.26, 0); });
        armL.rotation.x = armR.rotation.x = -1.1;                         // tangan ke depan (mengetik)
        const legs = [-.16, .16].map(x => { const l = box(.2, .22, .6, mat(0x2b3347), x, .02, -.28, person); return l; });
        // ikon status di atas kepala
        const icon = new T.Group(); icon.position.set(0, 2.55, 0); g.add(icon);
        const ic = { work: sprite('⚙', '#22c55e', .8), blocked: sprite('❗', '#ef4444', .9), sleep: sprite('z z', '#cbd5e1', 1) };
        Object.values(ic).forEach(s => { s.visible = false; icon.add(s); });
        // area klik
        const hit = new T.Mesh(new T.BoxGeometry(1.6, 2.4, 1.8), new T.MeshBasicMaterial({ visible: false })); hit.position.set(0, 1.2, .4); hit.userData.agentId = a.id; g.add(hit);
        // lampu meja (malam)
        const pl = new T.PointLight(0xffd9a0, 0, 7, 1.6); pl.position.set(cx, 3.2, cz + .4); scene.add(pl); lights.warm.push(pl);
        // alur data
        const curve = new T.CatmullRomCurve3([new T.Vector3(cx, 1.6, cz), new T.Vector3(cx, 3.6, cz - 1), new T.Vector3((cx + rackPos.x) / 2, 4.2, (cz + rackPos.z) / 2), rackPos.clone().add(new T.Vector3(0, .6, .8))]);
        const lineGeo = new T.BufferGeometry().setFromPoints(curve.getPoints(40));
        const line = new T.Line(lineGeo, new T.LineBasicMaterial({ color: 0x22c55e, transparent: true, opacity: .45 }));
        line.visible = false; world.add(line); flowLines.push(line);
        const orb = new T.Mesh(new T.SphereGeometry(.12, 10, 8), new T.MeshBasicMaterial({ color: 0x86efac })); orb.visible = false; world.add(orb);
        flowDots.push({ orb, curve, id: a.id, phase: Math.random() });
        state.entities.set(a.id, { g, body, head, armL, armR, screenMat, icon: ic, shirtM, skinM, hairM, shirt0: shirt.clone(), phase: Math.random() * 6, pos: new T.Vector3(cx, 2.8, cz + .9), line, hit });
      });

      fit();
      applyMode();
    }

    function applyMode() {
      const n = state.night;
      scene.background = new T.Color(n ? 0x070b18 : 0xcfe3f7);
      lights.amb.intensity = n ? .55 : .95; lights.amb.color.set(n ? 0x8fa0ff : 0xffffff);
      lights.sun.intensity = n ? .35 : .9; lights.sun.color.set(n ? 0xaab8ff : 0xffffff);
      lights.warm.forEach(l => l.intensity = n ? 2.2 : 0);
      if (state.strip) state.strip.emissiveIntensity = n ? 2.4 : .2;
      state.windowMats && state.windowMats.forEach(m => { m.map = n ? state.winNight : state.winDay; m.needsUpdate = true; });
    }

    function setStatuses(list) {
      list.forEach(a => {
        const e = state.entities.get(a.id); if (!e) return;
        const st = effStatus(a);
        e.status = st;
        const on = a.enabled;
        e.shirt0.set(a.color || '#6366f1');
        e.shirtM.color.copy(on ? e.shirt0 : new T.Color(0x6b7280));
        e.skinM.color.setScalar(on ? 1 : .6).multiply(new T.Color(SKIN[0]));
        const sm = e.screenMat;
        sm.map = null;
        if (st === 'working') { sm.map = state.codeTex; sm.color.set(0xffffff); sm.emissive.set(0x22c55e); sm.emissiveMap = state.codeTex; sm.emissiveIntensity = 1.1; }
        else if (st === 'idle') { sm.color.set(0x0c2a44); sm.emissive.set(0x38bdf8); sm.emissiveMap = null; sm.emissiveIntensity = .55; }
        else if (st === 'blocked') { sm.color.set(0x3a0d0d); sm.emissive.set(0xef4444); sm.emissiveMap = null; sm.emissiveIntensity = .9; }
        else { sm.color.set(0x0b1020); sm.emissive.set(0x000000); sm.emissiveMap = null; sm.emissiveIntensity = 0; }
        sm.needsUpdate = true;
        e.icon.work.visible = st === 'working'; e.icon.blocked.visible = st === 'blocked'; e.icon.sleep.visible = st === 'sleeping';
        e.line.material.color.set(0x22c55e);
      });
    }

    // ── kamera ──
    function fit() {
      const w = stage.clientWidth || 800, h = stage.clientHeight || 600;
      renderer.setSize(w, h, false);
      const { W, D } = state.room;
      const diag = Math.sqrt(W * W + D * D) * .5 / state.zoom;
      const aspect = w / h;
      camera.left = -diag * aspect / 1.1; camera.right = diag * aspect / 1.1; camera.top = diag / 1.1 + 1.2; camera.bottom = -diag / 1.1 + 1.2;
      camera.updateProjectionMatrix();
    }
    function placeCamera() {
      const r = 40, { az, el } = state;
      camera.position.set(state.pan.x + Math.sin(az) * Math.cos(el) * r, Math.sin(el) * r + state.pan.y, state.pan.z + Math.cos(az) * Math.cos(el) * r);
      camera.lookAt(state.pan.x, state.pan.y, state.pan.z);
    }

    // ── interaksi ──
    const ptrs = new Map(); let moved = 0, lastPinch = 0;
    canvas.addEventListener('pointerdown', e => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); moved = 0; canvas.classList.add('drag'); });
    canvas.addEventListener('pointermove', e => {
      const p = ptrs.get(e.pointerId); if (!p) return;
      const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
      if (ptrs.size === 2) {
        const [a, b] = [...ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (lastPinch) { state.zoom = Math.min(3, Math.max(.5, state.zoom * d / lastPinch)); fit(); } lastPinch = d; return;
      }
      if (e.shiftKey || e.buttons === 2) {
        const k = .02 / state.zoom; const right = new T.Vector3(Math.cos(state.az), 0, -Math.sin(state.az));
        state.pan.addScaledVector(right, -dx * k).addScaledVector(new T.Vector3(-Math.sin(state.az), 0, -Math.cos(state.az)), -dy * k);
      } else {
        state.az = Math.min(1.35, Math.max(.25, state.az - dx * .005));
        state.el = Math.min(1.0, Math.max(.35, state.el + dy * .004));
      }
    });
    const up = e => {
      ptrs.delete(e.pointerId); lastPinch = 0; canvas.classList.remove('drag');
      if (moved < 6 && e.type === 'pointerup') pick(e);
    };
    canvas.addEventListener('pointerup', up); canvas.addEventListener('pointercancel', up);
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    canvas.addEventListener('wheel', e => { e.preventDefault(); state.zoom = Math.min(3, Math.max(.5, state.zoom * (e.deltaY < 0 ? 1.1 : .91))); fit(); }, { passive: false });
    const ray = new T.Raycaster(), mouse = new T.Vector2();
    function pick(e) {
      const r = canvas.getBoundingClientRect();
      mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      const hits = ray.intersectObjects([...state.entities.values()].map(x => x.hit), false);
      select(hits.length ? hits[0].object.userData.agentId : null);
    }
    window.addEventListener('resize', fit);
    new ResizeObserver(fit).observe(stage);

    // ── label HTML ──
    const labelBox = $('labels'); const labelEls = new Map();
    function updateLabels(list) {
      labelBox.style.display = state.labels ? '' : 'none';
      if (!state.labels) return;
      const w = stage.clientWidth, h = stage.clientHeight; const v = new T.Vector3();
      for (const a of list) {
        const e = state.entities.get(a.id); if (!e) continue;
        let d = labelEls.get(a.id);
        if (!d) { d = el('div', 'lbl'); labelBox.append(d); labelEls.set(a.id, d); }
        const st = effStatus(a);
        d.style.setProperty('--c', COLOR[st]);
        if (d._k !== (a.emoji || '') + a.name + st) { d.replaceChildren(document.createTextNode((a.emoji ? a.emoji + ' ' : '') + a.name), el('small', null, LABEL[st])); d._k = (a.emoji || '') + a.name + st; }
        v.copy(e.pos).setY(3.3); v.project(camera);
        d.style.left = ((v.x + 1) / 2 * w) + 'px'; d.style.top = ((1 - v.y) / 2 * h) + 'px';
      }
      for (const [id, d] of labelEls) if (!agents.has(id)) { d.remove(); labelEls.delete(id); }
    }

    // ── animasi ──
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(.05, (now - last) / 1000); last = now; state.time += dt; const t = state.time;
      if (state.codeTex) state.codeTex.offset.y = -(t * .35) % 1;
      let anyWork = false;
      for (const [id, e] of state.entities) {
        const st = e.status || 'sleeping'; const ph = e.phase;
        let lean = 0, shake = 0;
        e.armL.rotation.x = e.armR.rotation.x = -1.1; e.head.rotation.set(0, 0, 0);
        if (st === 'working') {
          anyWork = true;
          e.armL.rotation.x = -1.1 + Math.sin(t * 14 + ph) * .12; e.armR.rotation.x = -1.1 + Math.sin(t * 14 + ph + 2) * .12;
          e.head.rotation.x = Math.sin(t * 2 + ph) * .05; lean = -.08;
          e.icon.work.material.rotation = t * 1.5; e.icon.work.position.y = Math.sin(t * 3 + ph) * .08;
        } else if (st === 'idle') {
          lean = .12 + Math.sin(t * .9 + ph) * .03; e.head.rotation.y = Math.sin(t * .6 + ph) * .35;
          e.armL.rotation.x = e.armR.rotation.x = -.5;
        } else if (st === 'blocked') {
          shake = Math.sin(t * 25) * .03; e.head.rotation.x = .25;
          e.icon.blocked.position.y = Math.abs(Math.sin(t * 4)) * .25;
          e.screenMat.emissiveIntensity = .5 + Math.abs(Math.sin(t * 4)) * .7;
          e.armL.rotation.x = e.armR.rotation.x = -.2;
        } else {
          lean = -.95; e.head.rotation.x = .25; e.armL.rotation.x = e.armR.rotation.x = -1.3;
          e.icon.sleep.position.y = Math.sin(t * 1.6 + ph) * .18; e.icon.sleep.material.opacity = .6 + Math.sin(t * 1.6 + ph) * .4;
        }
        e.body.rotation.x += (lean - e.body.rotation.x) * Math.min(1, dt * 6);
        e.body.position.x = shake;
      }
      rackLeds.forEach((m, i) => { m.emissiveIntensity = Math.sin(t * (anyWork ? 9 : 1.5) + i * 1.7) > (anyWork ? -.3 : .6) ? 1.6 : 0; });
      flowDots.forEach(f => {
        const ent = state.entities.get(f.id); const on = state.flow && ent && ent.status === 'working';
        f.orb.visible = on; if (ent) ent.line.visible = on;
        if (on) { f.phase = (f.phase + dt * .35) % 1; f.orb.position.copy(f.curve.getPoint(f.phase)); }
      });
      placeCamera(); renderer.render(scene, camera);
      updateLabels(sorted());
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // tombol
    $('tNight').onclick = e => { state.night = !state.night; e.currentTarget.classList.toggle('on', state.night); e.currentTarget.textContent = state.night ? '🌙 Malam' : '☀️ Siang'; applyMode(); };
    $('tFlow').onclick = e => { state.flow = !state.flow; e.currentTarget.classList.toggle('on', state.flow); };
    $('tLabel').onclick = e => { state.labels = !state.labels; e.currentTarget.classList.toggle('on', state.labels); };

    let builtKey = '';
    return {
      sync(list) {
        const key = list.map(a => a.id).join('|');
        if (key !== builtKey) { builtKey = key; build(list); }
        setStatuses(list);
      },
      state,
    };
  }

  function refresh() {
    renderLegend(); renderAgentList(); renderEvents(); renderCard();
    if (office) office.sync(sorted());
  }
  function setConn(ok, text) { dot.classList.toggle('on', ok); connText.textContent = text; }

  async function init() {
    office = initOffice();
    window.__office = office;
    if (!office) $('stage').append(Object.assign(el('div', 'err', 'Tampilan 3D tidak didukung browser ini. Daftar agen tetap tersedia di samping.'), { style: 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center' }));
    if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
      $('agents').append(el('div', 'err', 'SUPABASE_URL / SUPABASE_ANON_KEY belum diisi di .env'));
      setConn(false, 'tidak terkonfigurasi'); return;
    }
    const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    async function load() {
      const [a, e] = await Promise.all([
        db.from('agents').select('*'),
        db.from('agent_events').select('*').order('created_at', { ascending: false }).limit(40),
      ]);
      if (a.error || e.error) { setConn(false, 'error: ' + (a.error || e.error).message); return; }
      agents.clear(); a.data.forEach(x => agents.set(x.id, x));
      events = e.data; refresh();
    }
    await load();

    db.channel('kantor')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'agents' }, p => {
        if (p.eventType === 'DELETE') agents.delete(p.old.id); else agents.set(p.new.id, p.new);
        refresh();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'agent_events' }, p => {
        events = [p.new, ...events].slice(0, 40); renderEvents();
      })
      .subscribe(s => setConn(s === 'SUBSCRIBED', s === 'SUBSCRIBED' ? 'live' : s.toLowerCase()));

    setInterval(load, 60000);
    setInterval(() => { renderAgentList(); renderEvents(); renderCard(); }, 30000);
  }
  init();
})();
</script>
